[project]
name = "tpl-lab"
version = "0.1.0"
description = "Falsification lab for the 'Topological Phase-Locking' consciousness conjecture"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "ripser>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
full = ["giotto-tda", "mne", "scikit-dimension", "allensdk"]

[tool.setuptools.packages.find]
where = ["src"]
