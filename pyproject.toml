[project]
name = "tpl-lab"
version = "0.1.0"
description = "Falsification lab for a G2/SU(3) ≅ S⁶ conjecture about cortical dynamics"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "ripser>=0.6"]

[project.urls]
Homepage = "https://github.com/AxelNoun/tpl-lab"
Issues = "https://github.com/AxelNoun/tpl-lab/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "h5py"]
nwb = ["h5py"]
full = ["giotto-tda", "mne", "scikit-dimension", "allensdk", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]
